name: Generate Repair Relay lockfile

on:
  push:
    branches:
      - automation/repair-relay-lockfile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Resolve exact dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Audit resolved dependencies
        run: npm audit --audit-level=high
      - name: Upload lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repair-relay-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
