name: Public Origin WebMCP Smoke

on:
  push:
    branches:
      - test/public-origin-20260903
    paths:
      - "scripts/public-origin-smoke.mjs"
      - ".github/workflows/public-origin-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Test exact-commit public HTTPS build with native WebMCP and live data
        env:
          PUBLIC_URL: https://rawcdn.githack.com/JPalchak/repair-relay-webmcp/66b0508cfc3974a42c0fe559ad05212ab184d28d/index.html
        run: node scripts/public-origin-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-origin-smoke-${{ github.run_number }}
          path: |
            reports/public-origin-smoke.json
            reports/public-origin-smoke.png
          if-no-files-found: warn
          retention-days: 7
