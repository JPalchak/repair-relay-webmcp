<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Recall Relay social card">
  <rect width="1200" height="630" fill="#f5f2ea"/>
  <rect x="60" y="60" width="1080" height="510" rx="28" fill="#fffdf7" stroke="#1b1a17" stroke-width="4"/>
  <text x="110" y="150" font-family="Consolas, monospace" font-size="24" font-weight="800" fill="#1f4fd6" letter-spacing="4">RECALL RELAY · WEBMCP</text>
  <text x="110" y="250" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="800" fill="#1b1a17" letter-spacing="-2">The recall notice knows the lot code.</text>
  <text x="110" y="330" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="800" fill="#c8321e" letter-spacing="-2">Only you can see the lid.</text>
  <text x="110" y="410" font-family="Inter, Arial, sans-serif" font-size="28" fill="#6b675d">Agents sweep live FDA + CPSC notices for what is on your shelf.</text>
